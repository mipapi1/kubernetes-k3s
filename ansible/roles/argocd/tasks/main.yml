---
# Runs on the control node against the cluster's kubeconfig context.
# The initial admin password is in the argocd-initial-admin-secret Secret.
- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    kube_context: "{{ cluster_context }}"
    wait: true
    values_files:
      - "{{ role_path }}/files/values.yaml"
  delegate_to: localhost
  become: false
  run_once: true

# GitOps entry point: one Application per directory under apps/.
# - automated sync + selfHeal: the cluster follows git; manual drift gets reverted
# - prune: resources removed from an app's folder are removed from the cluster
# - preserveResourcesOnDeletion: deleting a whole app folder does NOT delete its
#   resources (and PVC data) — remove those deliberately with kubectl
- name: Create the apps ApplicationSet
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: apps
        namespace: argocd
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: "{{ argocd_apps_repo }}"
              revision: "{{ argocd_apps_revision }}"
              directories:
                - path: "{{ argocd_apps_path }}/*"
        syncPolicy:
          preserveResourcesOnDeletion: true
        template:
          metadata:
            name: "{{ '{{.path.basename}}' }}"
          spec:
            project: default
            source:
              repoURL: "{{ argocd_apps_repo }}"
              targetRevision: "{{ argocd_apps_revision }}"
              path: "{{ '{{.path.path}}' }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ '{{.path.basename}}' }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
  delegate_to: localhost
  become: false
  run_once: true
