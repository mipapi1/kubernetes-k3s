---
- name: Install nfs-common [Debian/Ubuntu]
  when: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Install nfs-utils [RHEL]
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: nfs-utils
    state: present
