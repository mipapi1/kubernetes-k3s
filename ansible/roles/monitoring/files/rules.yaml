# Homelab alerts on top of the chart's defaults (Kubernetes, nodes, VictoriaMetrics).
# Uptime Kuma still watches whether each service answers; these catch what Kuma can't
# see: storage health, disks filling up, hosts and VMs.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: longhorn
      rules:
        # One 0/1 series per state (healthy, degraded = a replica missing, faulted = no
        # healthy replica, unknown = detached)
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness{state="degraded"} == 1
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is degraded"
            description: "A replica is missing and hasn't been rebuilt for 15 minutes. Check the Longhorn UI."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness{state="faulted"} == 1
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is faulted"
            description: "No healthy replica left: the app using it is down. Restore from backup if it doesn't recover."
        - alert: LonghornNodeStorageLow
          expr: longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes > 0.8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
            description: "Replicas can't be rebuilt there once it's full."
    - name: proxmox
      rules:
        - alert: ProxmoxNodeDown
          expr: pve_up{id=~"node/.*"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Proxmox host {{ $labels.id }} is down"
        # VMs set to start on boot that aren't running
        - alert: ProxmoxGuestDown
          expr: pve_up{id=~"(qemu|lxc)/.*"} == 0 and on(id) pve_onboot_status == 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Proxmox guest {{ $labels.id }} is stopped (start at boot is on)"
        # Includes the NAS share (proxmox-nas): down when the NAS is off or NFS is stuck
        - alert: ProxmoxStorageDown
          expr: pve_up{id=~"storage/.*"} == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Proxmox storage {{ $labels.id }} is unavailable"
        - alert: ProxmoxStorageFull
          expr: pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 0.85
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full"
