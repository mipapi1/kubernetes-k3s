# Everything secret comes from Vault; nothing secret is in git. Reuses the entries the
# other apps already have:
#   secret/k8s/uptime/ntfy        topic (the ntfy.sh topic Uptime Kuma pushes to)
#   secret/k8s/uptime/smtp        password (Proton SMTP token for noreply@agathla.com), to
#   secret/k8s/homepage/proxmox   token-id (user@realm!name), token-secret: read-only
#                                 PVEAuditor token, shared with Homepage
#
# Alertmanager's whole config, so the ntfy topic and SMTP password never sit in Helm
# values. Info alerts and the always-firing Watchdog go nowhere; everything else is sent
# by push (ntfy) and email, again every 12h while it keeps firing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: alertmanager-config
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: notify
            group_by: [alertname, namespace]
            group_wait: 1m
            group_interval: 10m
            repeat_interval: 12h
            routes:
              - matchers: ['alertname=~"Watchdog|InfoInhibitor"']
                receiver: blackhole
              - matchers: ['severity="info"']
                receiver: blackhole
          inhibit_rules:
            # A critical alert silences the warning of the same name and namespace
            - source_matchers: ['severity="critical"']
              target_matchers: ['severity="warning"']
              equal: [alertname, namespace]
          receivers:
            - name: blackhole
            - name: notify
              webhook_configs:
                # ntfy formats Alertmanager's JSON itself (built-in "alertmanager" template)
                - url: 'https://ntfy.sh/{{ .ntfyTopic }}?template=alertmanager'
                  send_resolved: true
              email_configs:
                - to: '{{ .smtpTo }}'
                  from: 'Homelab <noreply@agathla.com>'
                  smarthost: 'smtp.protonmail.ch:587'
                  auth_username: noreply@agathla.com
                  auth_password: '{{ .smtpPassword }}'
                  require_tls: true
                  send_resolved: true
  data:
    - secretKey: ntfyTopic
      remoteRef: {key: k8s/uptime/ntfy, property: topic}
    - secretKey: smtpTo
      remoteRef: {key: k8s/uptime/smtp, property: to}
    - secretKey: smtpPassword
      remoteRef: {key: k8s/uptime/smtp, property: password}
---
# pve-exporter reads its Proxmox API token from the environment
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: pve-exporter
    template:
      engineVersion: v2
      data:
        PVE_USER: '{{ .tokenId | splitList "!" | first }}'
        PVE_TOKEN_NAME: '{{ .tokenId | splitList "!" | last }}'
        PVE_TOKEN_VALUE: '{{ .tokenSecret }}'
  data:
    - secretKey: tokenId
      remoteRef: {key: k8s/homepage/proxmox, property: token-id}
    - secretKey: tokenSecret
      remoteRef: {key: k8s/homepage/proxmox, property: token-secret}
