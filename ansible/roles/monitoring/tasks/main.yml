---
# Runs on the control node against the cluster's kubeconfig context.
# Installed by Ansible (platform layer), not Argo CD, like the other cluster add-ons:
# it has to keep watching when the apps (or Argo CD) are broken. Needs the
# external_secrets role and the Vault entries listed in files/external-secrets.yaml.
- name: Create the monitoring namespace
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
  delegate_to: localhost
  become: false
  run_once: true

- name: Sync the secrets from Vault
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    src: "{{ role_path }}/files/external-secrets.yaml"
  delegate_to: localhost
  become: false
  run_once: true

- name: Wait for the secrets
  kubernetes.core.k8s_info:
    context: "{{ cluster_context }}"
    kind: Secret
    namespace: monitoring
    name: "{{ item }}"
  register: monitoring_secret
  until: monitoring_secret.resources | length > 0
  retries: 12
  delay: 5
  loop: [alertmanager-config, pve-exporter]
  delegate_to: localhost
  become: false
  run_once: true

# Also creates the VictoriaMetrics CRDs used below. A post-install job fetches the
# default dashboards and alert rules (kubernetes-mixin, node-exporter, VictoriaMetrics).
- name: Install the VictoriaMetrics stack (VictoriaMetrics, vmagent, vmalert, Alertmanager, Grafana)
  kubernetes.core.helm:
    name: vm
    chart_ref: victoria-metrics-k8s-stack
    chart_repo_url: https://victoriametrics.github.io/helm-charts/
    chart_version: "{{ monitoring_chart_version }}"
    release_namespace: monitoring
    kube_context: "{{ cluster_context }}"
    wait: true
    wait_timeout: 10m
    values_files:
      - "{{ role_path }}/files/values.yaml"
  delegate_to: localhost
  become: false
  run_once: true

- name: Deploy the Grafana login and network policy
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    src: "{{ role_path }}/files/grafana.yaml"
  delegate_to: localhost
  become: false
  run_once: true

- name: Deploy the extra scrape targets (Proxmox, Longhorn, Traefik, OPNsense)
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    template: scrapes.yaml.j2
    wait: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Deploy the homelab alert rules
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    src: "{{ role_path }}/files/rules.yaml"
  delegate_to: localhost
  become: false
  run_once: true

# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1
- name: Deploy the homelab dashboards
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "dashboard-{{ item | basename | splitext | first }}"
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
      # Built as one dict so Ansible keeps the JSON a string (it would parse a bare value)
      data: "{{ {(item | basename): lookup('ansible.builtin.file', item)} }}"
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/dashboards/*.json') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  delegate_to: localhost
  become: false
  run_once: true
