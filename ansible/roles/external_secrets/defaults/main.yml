---
# https://github.com/external-secrets/external-secrets/releases
external_secrets_chart_version: "2.11.0"
# Vault as seen from inside the cluster (resolved via the coredns-custom override)
external_secrets_vault_server: "https://vault.agathla.com"
# Vault side (configured by hand, see README): auth/kubernetes + role below,
# policy grants read on secret/data/k8s/*
external_secrets_vault_auth_mount: kubernetes
external_secrets_vault_role: external-secrets
