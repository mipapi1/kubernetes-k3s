---
# Runs on the control node against the cluster's kubeconfig context.
# Installed by Ansible (platform layer), not Argo CD: the tool for fixing the cluster
# must not depend on Argo CD working. Sign-in with Authelia needs the k3s_oidc role (the
# API server must trust Authelia) and the Vault entry in files/oidc.yaml.
- name: Create the headlamp namespace
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: headlamp
  delegate_to: localhost
  become: false
  run_once: true

# The pod reads it as environment, so it must exist before Headlamp starts
- name: Sync the OIDC settings from Vault
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    src: "{{ role_path }}/files/oidc.yaml"
  delegate_to: localhost
  become: false
  run_once: true

- name: Wait for the OIDC settings
  kubernetes.core.k8s_info:
    context: "{{ cluster_context }}"
    kind: Secret
    namespace: headlamp
    name: headlamp-oidc
  register: headlamp_oidc_secret
  until: headlamp_oidc_secret.resources | length > 0
  retries: 12
  delay: 5
  delegate_to: localhost
  become: false
  run_once: true

- name: Install Headlamp (cluster UI)
  kubernetes.core.helm:
    name: headlamp
    chart_ref: headlamp
    chart_repo_url: https://kubernetes-sigs.github.io/headlamp/
    chart_version: "{{ headlamp_chart_version }}"
    release_namespace: headlamp
    kube_context: "{{ cluster_context }}"
    wait: true
    values_files:
      - "{{ role_path }}/files/values.yaml"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create the break-glass admin token, login and network policy
  kubernetes.core.k8s:
    context: "{{ cluster_context }}"
    state: present
    src: "{{ role_path }}/files/admin.yaml"
  delegate_to: localhost
  become: false
  run_once: true
