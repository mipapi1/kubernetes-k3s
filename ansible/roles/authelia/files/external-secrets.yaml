# Everything secret comes from Vault (secret/k8s/authelia/*); nothing secret is in git.
#   secret/k8s/authelia/main   jwt-secret, session-secret, storage-encryption-key,
#                              smtp-password (Proton SMTP token for noreply@agathla.com)
#   secret/k8s/authelia/users  papi-email, papi-password-hash (argon2id)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: authelia
  data:
    - secretKey: jwt-secret
      remoteRef: {key: k8s/authelia/main, property: jwt-secret}
    - secretKey: session-secret
      remoteRef: {key: k8s/authelia/main, property: session-secret}
    - secretKey: storage-encryption-key
      remoteRef: {key: k8s/authelia/main, property: storage-encryption-key}
    - secretKey: smtp-password
      remoteRef: {key: k8s/authelia/main, property: smtp-password}
---
# The user list (file backend). Passwords only as argon2id hashes; they are changed in
# Vault (password change/reset in the portal are off, the file is read-only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: authelia-users
    template:
      engineVersion: v2
      data:
        users_database.yml: |
          users:
            papi:
              disabled: false
              displayname: papi
              email: "{{ .papi_email }}"
              password: "{{ .papi_password_hash }}"
              groups: [admins]
  data:
    - secretKey: papi_email
      remoteRef: {key: k8s/authelia/users, property: papi-email}
    - secretKey: papi_password_hash
      remoteRef: {key: k8s/authelia/users, property: papi-password-hash}
