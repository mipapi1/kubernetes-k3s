# Everything secret comes from Vault (secret/k8s/authelia/*); nothing secret is in git.
#   secret/k8s/authelia/main   jwt-secret, session-secret, storage-encryption-key,
#                              smtp-password (Proton SMTP token for noreply@agathla.com)
#   secret/k8s/authelia/users  users (JSON, see below; managed with files/authelia-user.sh)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: authelia
  data:
    - secretKey: jwt-secret
      remoteRef: {key: k8s/authelia/main, property: jwt-secret}
    - secretKey: session-secret
      remoteRef: {key: k8s/authelia/main, property: session-secret}
    - secretKey: storage-encryption-key
      remoteRef: {key: k8s/authelia/main, property: storage-encryption-key}
    - secretKey: smtp-password
      remoteRef: {key: k8s/authelia/main, property: smtp-password}
---
# The user list (file backend), from one JSON value in Vault:
#   secret/k8s/authelia/users  users = {"<name>": {"displayname", "email", "password" (argon2id
#   hash), "groups": [...], "disabled": bool}, ...}
# Managed with files/authelia-user.sh (add, groups, password, disable, list). Refreshed every
# minute; Authelia reloads the file by itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: authelia
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: authelia-users
    template:
      engineVersion: v2
      data:
        users_database.yml: |
          users:
          {{- range $name, $u := (.users | fromJson) }}
            {{ $name }}:
              disabled: {{ $u.disabled | default false }}
              displayname: {{ $u.displayname | default $name | toJson }}
              email: {{ $u.email | toJson }}
              password: {{ $u.password | toJson }}
              groups: {{ $u.groups | default list | toJson }}
          {{- end }}
  data:
    - secretKey: users
      remoteRef: {key: k8s/authelia/users, property: users}
