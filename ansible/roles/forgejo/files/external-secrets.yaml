# Everything secret comes from Vault (secret/k8s/forgejo/*); nothing secret is in git.
#   secret/k8s/forgejo/admin     username, password   break-glass admin account
#   secret/k8s/forgejo/postgres  password             database user "forgejo"
#   secret/k8s/forgejo/app       secret-key, internal-token, jwt-secret, lfs-jwt-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: forgejo-admin
  data:
    - secretKey: username
      remoteRef: {key: k8s/forgejo/admin, property: username}
    - secretKey: password
      remoteRef: {key: k8s/forgejo/admin, property: password}
---
# Database login in the format CloudNativePG expects; it creates the user with it
# and keeps the password in sync (a change in Vault is applied within the refresh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: forgejo-db
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: k8s/forgejo/postgres, property: password}
---
# app.ini sections the chart merges in at startup (key = section name).
# The keys sign sessions/tokens and encrypt stored credentials such as 2FA secrets and
# mirror passwords, so they must survive a rebuild: Vault holds them, not the volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-app-ini
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: forgejo-app-ini
    template:
      engineVersion: v2
      data:
        database: |
          PASSWD={{ .db_password }}
        security: |
          SECRET_KEY={{ .secret_key }}
          INTERNAL_TOKEN={{ .internal_token }}
        oauth2: |
          JWT_SECRET={{ .jwt_secret }}
        server: |
          LFS_JWT_SECRET={{ .lfs_jwt_secret }}
  data:
    - secretKey: db_password
      remoteRef: {key: k8s/forgejo/postgres, property: password}
    - secretKey: secret_key
      remoteRef: {key: k8s/forgejo/app, property: secret-key}
    - secretKey: internal_token
      remoteRef: {key: k8s/forgejo/app, property: internal-token}
    - secretKey: jwt_secret
      remoteRef: {key: k8s/forgejo/app, property: jwt-secret}
    - secretKey: lfs_jwt_secret
      remoteRef: {key: k8s/forgejo/app, property: lfs-jwt-secret}
