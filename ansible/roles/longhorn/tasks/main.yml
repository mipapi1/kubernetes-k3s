---
# Node prerequisites (every node): https://longhorn.io/docs/latest/deploy/install/#installation-requirements
- name: Install open-iscsi [Debian/Ubuntu]
  when: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
  ansible.builtin.apt:
    name: open-iscsi
    state: present
    update_cache: true

- name: Install iscsi-initiator-utils [RHEL]
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: iscsi-initiator-utils
    state: present

- name: Load iscsi_tcp kernel module now and on boot
  community.general.modprobe:
    name: iscsi_tcp
    state: present
    persistent: present

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

# Ubuntu's multipathd grabs Longhorn's block devices and breaks volume mounts.
# https://longhorn.io/kb/troubleshooting-volume-with-multipath/
- name: Keep multipathd away from Longhorn devices
  ansible.builtin.copy:
    dest: /etc/multipath.conf
    mode: "0644"
    content: |
      defaults {
          user_friendly_names yes
      }
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  register: longhorn_multipath_conf

- name: Restart multipathd to pick up the blacklist
  when: longhorn_multipath_conf.changed
  ansible.builtin.systemd:
    name: multipathd
    state: restarted

# Cluster install (once, from the control node)
- name: Install Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn
    chart_repo_url: https://charts.longhorn.io
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: longhorn-system
    create_namespace: true
    kube_context: "{{ cluster_context }}"
    wait: true
    wait_timeout: 15m
    values:
      persistence:
        defaultClass: true
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
      defaultSettings:
        # Per data engine since Longhorn 1.8
        defaultReplicaCount: '{"v1":"{{ longhorn_replica_count }}","v2":"{{ longhorn_replica_count }}"}'
      defaultBackupStore:
        backupTarget: "{{ longhorn_backup_target }}"
  delegate_to: localhost
  become: false
  run_once: true
