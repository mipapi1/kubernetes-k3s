---
k3s_cluster:
  children:
    server:
      hosts:
        10.0.20.11:
        10.0.20.12:
        10.0.20.13:
    # No dedicated agents: servers also run workloads (k3s default)
    agent:
      hosts: {}

  vars:
    ansible_port: 22
    ansible_user: papi
    ansible_python_interpreter: auto_silent
    # k3s stable channel: https://update.k3s.io/v1-release/channels
    k3s_version: v1.36.5+k3s1
    # The k3s token comes from Vault (group_vars/k3s_cluster.yml)

    # OPNsense HAProxy VIP in front of the three API servers (TCP 6443).
    # Joining servers and the kubeconfig on the control node use it.
    api_endpoint: "10.0.20.10"
    # kubectl context name merged into ~/.kube/config on the control node
    cluster_context: homelab

    server_config_yaml: |
      cluster-cidr: 172.16.0.0/16
      service-cidr: 172.17.0.0/16
      tls-san:
        - 10.0.20.10
      # Longhorn replaces the local-path provisioner (and is the default StorageClass).
      # ServiceLB stays: it exposes Traefik on every node's :443, which HAProxy targets.
      disable:
        - local-storage
      # etcd shares each node's single disk with Longhorn. With the defaults (100 ms
      # heartbeat, 1 s election timeout) a few seconds of disk contention cost the
      # leader its lease and k3s restarted (2026-10-06/07). Tolerate short stalls.
      etcd-arg:
        - heartbeat-interval=500
        - election-timeout=5000

    # Copied to /var/lib/rancher/k3s/server/manifests and applied by k3s
    extra_manifests:
      - "{{ inventory_dir }}/manifests/traefik-config.yaml"
      - "{{ inventory_dir }}/manifests/coredns-custom.yaml"
      - "{{ inventory_dir }}/manifests/coredns-replicas.yaml"

    # Storage
    nfs_server: "10.0.25.10"
    nfs_share: "/volume1/kubernetes"

    # Add-ons (see site.yml); chart versions are pinned in each role's defaults
    install_nfs_csi: true
    install_longhorn: true
    install_argocd: true
    install_external_secrets: true
    install_cloudnative_pg: true
    install_forgejo: true
    install_authelia: true
    # The repo Argo CD deploys apps/ from: Forgejo over its in-cluster Service (no
    # HAProxy/DNS in the path). The forgejo role sets up Argo CD's read-only access;
    # GitHub only holds a push mirror.
    argocd_apps_repo: http://forgejo-http.forgejo.svc.cluster.local:3000/papi/kubernetes-k3s.git
    # TLS is terminated by HAProxy on OPNsense (ACME certs), so cert-manager isn't needed yet
    install_cert_manager: false
    cert_manager_email: "admin@agathla.com"
