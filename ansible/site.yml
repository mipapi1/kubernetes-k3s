---
- name: Preflight - control node tools
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Check helm and kubectl are installed (add-on roles run them from here)
      ansible.builtin.command: "{{ item }}"
      loop:
        - helm version --short
        - kubectl version --client
      changed_when: false

- name: NFS client prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  roles:
    - role: nfs

# Upstream k3s install (prereq, airgap, raspberrypi, k3s_server, k3s_agent)
- name: Install k3s
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Setup cert-manager
  hosts: server[0]
  gather_facts: false
  become: false
  roles:
    - role: cert_manager
      when: install_cert_manager | default(false)

- name: Setup NFS CSI driver
  hosts: server[0]
  gather_facts: false
  become: false
  roles:
    - role: nfs_csi
      when: install_nfs_csi | default(false)

- name: Setup Longhorn
  hosts: k3s_cluster
  gather_facts: true
  become: true
  roles:
    - role: longhorn
      when: install_longhorn | default(false)

- name: Setup Argo CD
  hosts: server[0]
  gather_facts: false
  become: false
  roles:
    - role: argocd
      when: install_argocd | default(false)
