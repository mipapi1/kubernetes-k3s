# Widget credentials from Vault, as HOMEPAGE_VAR_* environment variables that the
# config files reference as {{HOMEPAGE_VAR_...}}. All read-only API tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: homepage
  data:
    # Proxmox user homepage@pve, role PVEAuditor on / (read-only)
    - {secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_ID, remoteRef: {key: k8s/homepage/proxmox, property: token-id}}
    - {secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET, remoteRef: {key: k8s/homepage/proxmox, property: token-secret}}
