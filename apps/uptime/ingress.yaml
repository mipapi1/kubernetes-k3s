# https://uptime.agathla.com -> HAProxy (TLS) -> Traefik -> Authelia login (2FA) -> Uptime Kuma
# Needs DNS uptime.agathla.com -> 10.0.20.10, and `uptime` in the Authelia role's authelia_apps.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: uptime-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: uptime.agathla.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: uptime-kuma, port: {number: 3001}}
---
# Kuma's own login gets turned off (Authelia does it), so only Traefik and the heartbeat
# job may reach it; kubelet probes come from the nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uptime-kuma-ingress
spec:
  podSelector:
    matchLabels: {app: uptime-kuma}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
    - from:
        - podSelector:
            matchLabels: {app: heartbeat}
    - from:
        - ipBlock: {cidr: 10.0.20.11/32}
        - ipBlock: {cidr: 10.0.20.12/32}
        - ipBlock: {cidr: 10.0.20.13/32}
