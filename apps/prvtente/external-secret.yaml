# All Ente secrets come from Vault (secret/k8s/prvtente/*); nothing secret is in git.
#   secret/k8s/prvtente/postgres  password
#   secret/k8s/prvtente/minio     root-user, root-password (also the S3 key/secret museum uses)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: postgres
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: k8s/prvtente/postgres, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: minio
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef: {key: k8s/prvtente/minio, property: root-user}
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef: {key: k8s/prvtente/minio, property: root-password}
---
# museum's credentials.yaml, rendered from Vault values. Same content as the VM's
# config/scripts/compose/credentials.yaml, except the replica buckets now reach MinIO
# by its cluster name instead of the VM's localhost:3200 socat forwarder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: museum-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: museum-credentials
    template:
      engineVersion: v2
      data:
        credentials.yaml: |
          db:
            host: postgres
            port: 5432
            name: ente_db
            user: pguser
            password: "{{ .db_password }}"
          s3:
            are_local_buckets: true
            b2-eu-cen:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: https://prvtenteminio.agathla.com
              region: eu-central-2
              bucket: b2-eu-cen
            wasabi-eu-central-2-v3:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: minio:3200
              region: eu-central-2
              bucket: wasabi-eu-central-2-v3
              compliance: false
            scw-eu-fr-v3:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: minio:3200
              region: eu-central-2
              bucket: scw-eu-fr-v3
  data:
    - secretKey: db_password
      remoteRef: {key: k8s/prvtente/postgres, property: password}
    - secretKey: s3_key
      remoteRef: {key: k8s/prvtente/minio, property: root-user}
    - secretKey: s3_secret
      remoteRef: {key: k8s/prvtente/minio, property: root-password}
