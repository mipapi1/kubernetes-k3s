# Photo objects (MinIO data): the existing NAS share, mounted as-is (no copy, small instance).
# Same NFSv3 mount the VM uses. The NAS export must allow the k3s nodes (10.0.20.0/24).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prvtente-objects
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
  nfs:
    server: 10.0.25.10
    path: /volume1/prvtente
  claimRef:
    namespace: prvtente
    name: prvtente-objects
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prvtente-objects
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: prvtente-objects
  resources:
    requests:
      storage: 1Ti
---
# Postgres data: Longhorn, 2 replicas, backed up to the NAS
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
