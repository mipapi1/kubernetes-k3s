# gluetun + every app that ran with network_mode: service:gluetun on the VM.
# All containers in a pod share one network namespace, so (as on the VM) all their
# internet traffic leaves through the ProtonVPN tunnel and they still reach each
# other on localhost — the apps' existing settings keep working unchanged.
#
# replicas: 0 until cutover (see README.md). Two gluetun instances with the same
# WireGuard key knock each other offline, so this must not run alongside the VM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vpn-stack}
  template:
    metadata:
      labels: {app: vpn-stack, homelab/disk-heavy: "true"}
    spec:
      # Disk-heavy (database on Longhorn): prefer a node without another disk-heavy
      # pod from any app, so they spread over the nodes instead of piling up on one.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchLabels: {homelab/disk-heavy: "true"}
      initContainers:
        # Seerr runs as UID 1000; Jellyseerr (root) left root-owned files in the config
        # volume. Fix ownership of that one volume on every start (no-op once correct).
        - name: seerr-config-owner
          image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
          command: [chown, -R, "1000:1000", /app/config]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: jellyseerr-config, mountPath: /app/config}
        # Native sidecar: starts first, the apps only start once the VPN is healthy
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - {name: TZ, value: America/New_York}
            - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
            - {name: VPN_TYPE, value: wireguard}
            - {name: SERVER_COUNTRIES, value: United States}
            - {name: SERVER_CITIES, value: Philadelphia}
            - {name: HEALTH_SERVER_ADDRESS, value: ":9999"}
            # Traffic allowed outside the tunnel: pods, services, the K3s VLAN, the NAS
            - {name: FIREWALL_OUTBOUND_SUBNETS, value: "172.16.0.0/16,172.17.0.0/16,10.0.20.0/24,10.0.25.0/24"}
            # Web UIs reachable from Traefik (gluetun blocks inbound by default)
            - {name: FIREWALL_INPUT_PORTS, value: "8080,6789,9696,7878,8989,8686,6767,5055"}
          envFrom:
            - secretRef: {name: gluetun}
          # The pod's network namespace outlives a gluetun restart, and the routing rules
          # left behind make the new gluetun fail ("ip rule ... file exists") until the
          # whole pod is recreated. Clear them on every start (gluetun wiki, Kubernetes).
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          startupProbe:
            httpGet: {path: /, port: 9999}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /, port: 9999}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tun, mountPath: /dev/net/tun}
            - {name: gluetun-data, mountPath: /gluetun}
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
            - {name: WEBUI_PORT, value: "8080"}
            - {name: TORRENTING_PORT, value: "6881"}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: qbittorrent-config, mountPath: /config}
            - {name: media, mountPath: /data}
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:v26.3-ls266
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: nzbget-config, mountPath: /config}
            - {name: media, mountPath: /data}
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 20m, memory: 192Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: prowlarr-config, mountPath: /config}
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: sonarr-config, mountPath: /config}
            - {name: media, mountPath: /data}
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: radarr-config, mountPath: /config}
            - {name: media, mountPath: /data}
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls43
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 20m, memory: 160Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: lidarr-config, mountPath: /config}
            - {name: media, mountPath: /data}
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:v1.6.2-ls367
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/New_York}
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: bazarr-config, mountPath: /config}
            - {name: media, mountPath: /data}
        # Seerr: the successor of Jellyseerr (merged with Overseerr). Same port, same
        # config volume; it migrates Jellyseerr's database by itself on first start.
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
          env:
            - {name: TZ, value: America/New_York}
          # The image runs as `node` (UID 1000), not root like Jellyseerr did
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: jellyseerr-config, mountPath: /app/config}
      volumes:
        - name: tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: gluetun-data
          emptyDir: {}
        - name: media
          persistentVolumeClaim: {claimName: media-library}
        - {name: qbittorrent-config, persistentVolumeClaim: {claimName: qbittorrent-config}}
        - {name: nzbget-config, persistentVolumeClaim: {claimName: nzbget-config}}
        - {name: prowlarr-config, persistentVolumeClaim: {claimName: prowlarr-config}}
        - {name: sonarr-config, persistentVolumeClaim: {claimName: sonarr-config}}
        - {name: radarr-config, persistentVolumeClaim: {claimName: radarr-config}}
        - {name: lidarr-config, persistentVolumeClaim: {claimName: lidarr-config}}
        - {name: bazarr-config, persistentVolumeClaim: {claimName: bazarr-config}}
        - {name: jellyseerr-config, persistentVolumeClaim: {claimName: jellyseerr-config}}
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-stack
spec:
  selector: {app: vpn-stack}
  ports:
    - {name: qbittorrent, port: 8080, targetPort: 8080}
    - {name: nzbget, port: 6789, targetPort: 6789}
    - {name: prowlarr, port: 9696, targetPort: 9696}
    - {name: radarr, port: 7878, targetPort: 7878}
    - {name: sonarr, port: 8989, targetPort: 8989}
    - {name: lidarr, port: 8686, targetPort: 8686}
    - {name: bazarr, port: 6767, targetPort: 6767}
    - {name: jellyseerr, port: 5055, targetPort: 5055}
