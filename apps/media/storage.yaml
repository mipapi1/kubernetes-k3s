# Media library: the existing NAS share, mounted as-is (no copy). Same NFSv3 mount
# the VM uses. The NAS export must allow the k3s nodes (10.0.20.0/24).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library
spec:
  capacity:
    storage: 6Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: 10.0.25.10
    path: /volume1/plex
  claimRef:
    namespace: media
    name: media-library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: media-library
  resources:
    requests:
      storage: 6Ti
---
# App configs/databases (were /docker/servarr/configs/<app>): Longhorn, 2 replicas,
# backed up to the NAS. Sized with room to grow from today's usage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: {requests: {storage: 1Gi}}
