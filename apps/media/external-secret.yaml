# ProtonVPN WireGuard key for gluetun, from Vault: secret/k8s/media/gluetun
#   vault kv put secret/k8s/media/gluetun wireguard-private-key='<key from the VM .env>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gluetun
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: k8s/media/gluetun
        property: wireguard-private-key
