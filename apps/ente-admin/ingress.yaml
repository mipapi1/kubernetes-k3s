# https://ente-admin.agathla.com -> HAProxy (TLS) -> Traefik -> Authelia login (2FA) -> dashboard
# Needs DNS ente-admin.agathla.com -> 10.0.20.10 (alias of the k3s entry).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ente-admin
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ente-admin-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ente-admin.agathla.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ente-admin, port: {number: 8000}}
