# Everything secret comes from Vault (secret/k8s/ente-admin); nothing secret is in git.
#   ente-db-password, prvtente-db-password  read-only Postgres role ente_dashboard
#   key-encryption        museum's key.encryption (decrypts account emails)
#   oauth-client-id, oauth-client-secret    Forgejo OAuth2 application "ente-admin"
#   cookie-secret         oauth2-proxy session cookie key
#   allowed-email         the Forgejo account email allowed in (papi)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: ente-admin
    template:
      engineVersion: v2
      data:
        ente-db-password: "{{ .ente_db_password }}"
        prvtente-db-password: "{{ .prvtente_db_password }}"
        key-encryption: "{{ .key_encryption }}"
        oauth-client-id: "{{ .oauth_client_id }}"
        oauth-client-secret: "{{ .oauth_client_secret }}"
        cookie-secret: "{{ .cookie_secret }}"
        # oauth2-proxy's allow list: one email per line
        allowed-emails: "{{ .allowed_email }}"
  data:
    - {secretKey: ente_db_password, remoteRef: {key: k8s/ente-admin, property: ente-db-password}}
    - {secretKey: prvtente_db_password, remoteRef: {key: k8s/ente-admin, property: prvtente-db-password}}
    - {secretKey: key_encryption, remoteRef: {key: k8s/ente-admin, property: key-encryption}}
    - {secretKey: oauth_client_id, remoteRef: {key: k8s/ente-admin, property: oauth-client-id}}
    - {secretKey: oauth_client_secret, remoteRef: {key: k8s/ente-admin, property: oauth-client-secret}}
    - {secretKey: cookie_secret, remoteRef: {key: k8s/ente-admin, property: cookie-secret}}
    - {secretKey: allowed_email, remoteRef: {key: k8s/ente-admin, property: allowed-email}}
