# Everything secret comes from Vault (secret/k8s/ente-admin); nothing secret is in git.
#   ente-db-password, prvtente-db-password  read-only Postgres role ente_dashboard
#   key-encryption        museum's key.encryption (decrypts account emails)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: ente-admin
  data:
    - {secretKey: ente-db-password, remoteRef: {key: k8s/ente-admin, property: ente-db-password}}
    - {secretKey: prvtente-db-password, remoteRef: {key: k8s/ente-admin, property: prvtente-db-password}}
    - {secretKey: key-encryption, remoteRef: {key: k8s/ente-admin, property: key-encryption}}
---
# Directory of Authelia users for the "share with" picker: only username, display name,
# groups and whether the account is disabled (no emails, no password hashes). Built from
# the same Vault value Authelia's user list comes from (authelia-user.sh manages it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-directory
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: authelia-directory
    template:
      engineVersion: v2
      data:
        directory.json: |
          [{{- $first := true }}{{- range $name, $u := (.users | fromJson) }}{{ if not $first }},{{ end }}{{ $first = false }}
            {"user": {{ $name | toJson }}, "name": {{ get $u "displayname" | default $name | toJson }}, "groups": {{ get $u "groups" | default list | toJson }}, "disabled": {{ get $u "disabled" | default false }}}{{- end }}
          ]
  data:
    - {secretKey: users, remoteRef: {key: k8s/authelia/users, property: users}}
