apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secret.yaml
  - deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml
# The dashboard code; a change gets a new ConfigMap name, which restarts the pod
configMapGenerator:
  - name: ente-admin-app
    files: [app.py]
