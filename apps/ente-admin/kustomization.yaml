apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secret.yaml
  - deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml
# The dashboard code; a change gets a new ConfigMap name, which restarts the pod
configMapGenerator:
  - name: ente-admin-app
    files: [app.py]
  # Ente's artwork for the page (served by app.py under /media/). Too big (~400 KiB) for
  # client-side apply's last-applied annotation (256 KiB max), so Argo CD applies it
  # server-side.
  - name: ente-admin-media
    options:
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
    files:
      - media/ducky.png
      - media/auth-ducky.svg
      - media/feature-family-plan.webp
      - media/rocketship.webp
      - media/floss-fund.png
