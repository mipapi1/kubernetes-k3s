# The dashboard (app.py, :8000). Login is Authelia (see ingress.yaml); only Traefik may
# reach the pod (networkpolicy.yaml), so the login can't be bypassed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ente-admin
spec:
  replicas: 1
  # The sharing database is on a ReadWriteOnce volume
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ente-admin}
  template:
    metadata:
      labels: {app: ente-admin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Python libraries for the dashboard (Postgres driver, NaCl for the emails),
        # pinned. Until the dashboard gets its own image built by Forgejo CI.
        - name: deps
          image: python:3.13-slim@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c
          command: [pip, install, --no-cache-dir, --disable-pip-version-check, --target, /deps,
                    "psycopg[binary]==3.3.6", "pynacl==1.6.2"]
          env:
            - {name: HOME, value: /tmp}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: deps, mountPath: /deps}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: dashboard
          image: python:3.13-slim@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c
          command: [python, -u, /app/app.py]
          env:
            - {name: PYTHONPATH, value: /deps}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: TZ, value: America/New_York}
            # Who may see which account (managed by admins on the page)
            - {name: GRANTS_DB, value: /data/grants.db}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext: *restricted
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: media, mountPath: /media, readOnly: true}
            - {name: deps, mountPath: /deps, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: app
          configMap: {name: ente-admin-app}
        - name: media
          configMap: {name: ente-admin-media}
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret: {secretName: ente-admin}
        - name: data
          persistentVolumeClaim: {claimName: ente-admin-data}
---
# Sharing settings (SQLite); in the nightly Longhorn backups like every volume
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ente-admin-data
  annotations:
    # Never let Argo CD delete the data because the claim disappeared from git
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ente-admin
spec:
  selector: {app: ente-admin}
  ports:
    - {name: http, port: 8000, targetPort: http}
