# All Ente secrets come from Vault (secret/k8s/ente/*); nothing secret is in git.
#   secret/k8s/ente/postgres  password
#   secret/k8s/ente/minio     root-user, root-password (Silo admin only);
#                               museum-key, museum-secret (museum's Silo user, limited to its buckets)
#   secret/k8s/ente/museum    jwt-secret (signs login tokens; replaces the public default)
#   secret/k8s/ente/smtp       username, password (Proton SMTP token; shared by ente and prvtente)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: postgres
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: k8s/ente/postgres, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: minio
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef: {key: k8s/ente/minio, property: root-user}
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef: {key: k8s/ente/minio, property: root-password}
---
# museum's credentials.yaml, rendered from Vault values. Same content as the VM's
# config/scripts/compose/credentials.yaml, except the replica buckets now reach MinIO
# by its cluster name instead of the VM's localhost:3200 socat forwarder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: museum-credentials
  annotations:
    # Applied before the museum Deployment, so the new credentials are in place first
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: museum-credentials
    template:
      engineVersion: v2
      data:
        credentials.yaml: |
          jwt:
            secret: "{{ .jwt_secret }}"
          db:
            host: postgres
            port: 5432
            name: ente_db
            user: pguser
            password: "{{ .db_password }}"
          s3:
            are_local_buckets: true
            b2-eu-cen:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: https://minio.agathla.com
              region: eu-central-2
              bucket: b2-eu-cen
            wasabi-eu-central-2-v3:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: minio:3200
              region: eu-central-2
              bucket: wasabi-eu-central-2-v3
              compliance: false
            scw-eu-fr-v3:
              key: "{{ .s3_key }}"
              secret: "{{ .s3_secret }}"
              endpoint: minio:3200
              region: eu-central-2
              bucket: scw-eu-fr-v3
          # Login codes and notifications, sent as noreply@agathla.com through Proton
          # (STARTTLS on 587: an empty `encryption` means STARTTLS; tls/ssl would mean 465)
          smtp:
            host: smtp.protonmail.ch
            port: 587
            username: "{{ .smtp_username }}"
            password: "{{ .smtp_password }}"
            email: noreply@agathla.com
  data:
    - secretKey: db_password
      remoteRef: {key: k8s/ente/postgres, property: password}
    - secretKey: s3_key
      remoteRef: {key: k8s/ente/minio, property: museum-key}
    - secretKey: s3_secret
      remoteRef: {key: k8s/ente/minio, property: museum-secret}
    - secretKey: jwt_secret
      remoteRef: {key: k8s/ente/museum, property: jwt-secret}
    - secretKey: smtp_username
      remoteRef: {key: k8s/ente/smtp, property: username}
    - secretKey: smtp_password
      remoteRef: {key: k8s/ente/smtp, property: password}
