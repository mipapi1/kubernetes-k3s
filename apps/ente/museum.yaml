# museum: the Ente API server, official image pinned by digest.
#
# NOTE: museum.yaml sets no key.encryption / key.hash / jwt.secret, so museum uses the
# defaults built into the image. They must stay identical across the migration (data in
# Postgres is encrypted with them); rotating them is a separate, careful step.
#
# replicas: 0 until cutover.
apiVersion: v1
kind: ConfigMap
metadata:
  name: museum-config
data:
  museum.yaml: |
    apps:
      public-albums: https://ente.agathla.com
    internal:
      admins:
        - 1580559962386438
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: museum}
  template:
    metadata:
      labels: {app: museum}
    spec:
      containers:
        - name: museum
          # Official Ente image (2026-09-15), same as prvtente. Upgraded from the VM's
          # 2025-12-15 build on 2026-10-06; the database migrated forward (schema 113 -> 142).
          image: ghcr.io/ente/server:163f45c26f130090abed03649530f53d2d976565@sha256:3511ff25db3bf950abeb3983928eeadeed7f53b690ee94704c14be72fa719b1d
          env:
            - {name: ENTE_CREDENTIALS_FILE, value: /credentials.yaml}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ping, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /museum.yaml, subPath: museum.yaml, readOnly: true}
            - {name: credentials, mountPath: /credentials.yaml, subPath: credentials.yaml, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /var/logs}
      volumes:
        - name: config
          configMap: {name: museum-config}
        - name: credentials
          secret: {secretName: museum-credentials}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: museum
spec:
  selector: {app: museum}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
