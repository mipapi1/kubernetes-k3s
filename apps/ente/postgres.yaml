# Postgres for museum. Same major/minor version as the VM (15.15).
# Runs from staging on (empty database); the VM's data is restored into it at cutover.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, homelab/disk-heavy: "true"}
    spec:
      # Disk-heavy (database on Longhorn): prefer a node without another disk-heavy
      # pod from any app, so they spread over the nodes instead of piling up on one.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchLabels: {homelab/disk-heavy: "true"}
      containers:
        - name: postgres
          image: postgres:15.19
          env:
            - {name: POSTGRES_USER, value: pguser}
            - {name: POSTGRES_DB, value: ente_db}
            # Subdirectory: the volume's root contains lost+found
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom:
            - secretRef: {name: postgres}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-U", "pguser", "-d", "ente_db"]
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
